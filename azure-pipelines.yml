trigger:
- master

variables:
  #Azure resources manager connection created during pipeline creation
  azureSubscription: 'sc-res-webapp'
  
  #Web app name
  webAppName: 'res-webApp'
  
  # resource group name
  resourceGroupName: 'res-webapp'
  #Environment name: 
  environmentName: 'dev'
  #Agent VM image name
  vmImageName: ubuntu-latest

stages:
- stage: Archive
  displayName: Archive stage
  jobs:
  - job: Archive
    displayName: Archive
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureAppServiceSettings@1
      inputs:
        azureSubscription: $(azureSubscription)
        appName: $(webAppName)
        resourceGroupName: $(resourceGroupName)
        appSettings: |
          [
            {
              "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
              "value": "true"
            }
          ]
    - task: ArchiveFiles@2
      displayName: 'Archive files'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true
    
    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      artifact: drop

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Archive
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: Deploy
    environment: $(environmentName)
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Azure Web App Deploy: Test-NodeJS-Deploy'
            inputs:
              azureSubscription: $(azureSubscription)
              appType: webAppLinux
              appName: $(webAppName)
              runTimeStack: 'NODE|24-lts'
              package: $(Pipeline.Workspace)/drop/$(Build.BuildId).zip