name: Test Project
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install Node-js 
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install dependencies
        run: npm ci
      - name: run test
        run: npm tests
        